; PlatformIO Project Configuration File
;
;   RGB Panel - адресная светодиодная панель с удалённым управлением.
;   Подробности по железу: docs/HARDWARE.md
;   Параметры сети:        docs/WIFI.md
;   Журнал спринтов:       docs/SPRINTS.md

[env:esp32dev]
platform = espressif32
board = esp32dev
; Стандартная таблица разделов оставляет под приложение 1.3 МБ, а с Wi-Fi
; прошивка занимает уже 76 %. min_spiffs даёт 1.9 МБ и сохраняет OTA.
board_build.partitions = min_spiffs.csv
framework = arduino
; Подставляет WIFI_SSID и WIFI_PASSWORD из .env в флаги сборки.
extra_scripts = pre:scripts/load_env.py
lib_deps =
    fastled/FastLED@^3.9.13
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3

; Заливка по воздуху. Пароль подставляет scripts/load_env.py из .env.
; Если имя не разрешается, укажите адрес: --upload-port 192.168.1.42
[env:esp32dev-ota]
extends = env:esp32dev
; Пароль подставляется post-скриптом: флаги espota платформа задаёт после
; pre-скриптов и затирает всё, что добавлено раньше.
extra_scripts =
    pre:scripts/load_env.py
    post:scripts/ota_auth.py
upload_protocol = espota
upload_port = rgb-panel.local
